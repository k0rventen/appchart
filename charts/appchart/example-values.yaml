# the chart will iter on apps
apps:

    # complex deployment with various available options
    # name for the deployment and pods
  - name: busy
  
    # image  
    image: busybox@sha256:37f7b378a29ceb4c551b1b5582e27747b855bbfaa73fa11914fe0df028dc581f

    # use this key to configure the deployment spec
    deploymentSpec:
      strategy:
        type: Recreate

    # env vars
    env:
      - name: key
        value: val

    # classic volume definition
    volumeMounts:
      - name: config
        mountPath: /etc/app
      - name: data
        mountPath: /data
    volumes:
      - name: config
        configMap:
          name: conf
      - name: data
        persistentVolumeClaim:
          claimName: data

    # extra spec for the pod
    podSpec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                - antarctica-east1

    # extras spec for the container
    containerSpec:
      envFrom:
        - secretRef:
            name: test-secret

    # create a svc on that target port (svc wil lhave the same port)
    service: 8080
    
    # enable an anubis sidecar for scraper protection (will proxy the traffic to the pod)
    anubis: true
    
    # will create a pvc w/ this name
    pvc:
      - data
    
    # create the appropriate ingress
    # public: true means a second ingress using the public ingressClass
    ingress:
      public: true # default to false
      geoblock: false # default true, false disable geoblocking 
      oidc: true # default false, enable OIDC middleware
      domain: app.domain.com # for the host and tls 

# shortcuts for creating simple configmaps (like non sensitive files to mount)
configmaps:
  webserver-config:
    Caddyfile: |
      :80 {
          root * /html
          file_server
          try_files {path} /index.html
      }
